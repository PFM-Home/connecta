<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecta — Agenda de Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">

            <a href="index.html" class="logo-link" title="Connecta Home">
                <img src="assets/logo_connecta.png" alt="Logotipo do Connecta" class="logo-img" width="36" height="36">
                <span class="logo-text">Connecta</span>
            </a>

            <form class="search-form" action="#" method="GET" role="search">
                <div class="search-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" class="search-input" placeholder="Buscar no Connecta..." aria-label="Buscar no Connecta">
                </div>
            </form>

            <div class="header-actions">
                <button type="button" class="btn btn-outline">Entrar</button>
                <button type="button" class="btn btn-primary">Criar Conta</button>
                <button type="button" class="btn-menu-mobile" aria-label="Abrir menu de navegação móvel">
                    <svg class="hamburger-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Navegação Lateral">
                <ul class="sidebar-list">
                    <li class="sidebar-item">
                        <a href="index.html" class="sidebar-link">Contatos</a>
                    </li>
                    <li class="sidebar-item">
                        <a href="agenda.html" class="sidebar-link">Agenda</a>
                    </li>
                    <li class="sidebar-item">
                        <a href="tarefas.html" class="sidebar-link">Tarefas</a>
                    </li>
                    <li class="sidebar-item">
                        <a href="grupos.html" class="sidebar-link">Grupos</a>
                    </li>
                    <li class="sidebar-item">
                        <a href="lembretes.html" class="sidebar-link">Lembretes</a>
                    </li>
                    <li class="sidebar-item">
                        <a href="config.html" class="sidebar-link">Configurações</a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="btn-back-home">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Voltar ao Início</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
        </main>
    </div>

</body>
</html>
