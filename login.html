<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Connecta</title>
  <meta name="description" content="Entre ou crie sua conta no Connecta.">

  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <img src="assets/logo_connecta.png" alt="" width="36" height="36">
        <span>
          <strong>connecta</strong>
          <small>Agenda de contatos</small>
        </span>
      </a>
      <div class="header-actions" id="auth-area"></div>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="container">
        <div class="auth-card">

          <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab is-active" role="tab" data-tab="login" aria-selected="true" aria-controls="form-login">Entrar</button>
            <button type="button" class="auth-tab" role="tab" data-tab="register" aria-selected="false" aria-controls="form-register">Criar conta</button>
          </div>

          <form class="auth-form" id="form-login" novalidate>
            <h1>Bem-vindo de volta</h1>
            <div class="field">
              <label for="login-email">E-mail</label>
              <input type="email" id="login-email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="login-senha">Senha</label>
              <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
            </div>
            <label class="auth-lembrar">
              <input type="checkbox" name="lembrar" checked>
              Manter conectado
            </label>
            <p class="auth-msg" role="alert"></p>
            <button type="submit" class="btn btn--primary btn--lg">Entrar</button>
          </form>

          <form class="auth-form" id="form-register" hidden novalidate>
            <h1>Crie sua conta</h1>
            <div class="field">
              <label for="reg-nome">Nome</label>
              <input type="text" id="reg-nome" name="nome" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="reg-email">E-mail</label>
              <input type="email" id="reg-email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="reg-senha">Senha</label>
              <input type="password" id="reg-senha" name="senha" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="field">
              <label for="reg-confirmar">Confirmar senha</label>
              <input type="password" id="reg-confirmar" name="confirmar" autocomplete="new-password" required>
            </div>
            <p class="auth-msg" role="alert"></p>
            <button type="submit" class="btn btn--primary btn--lg">Criar conta</button>
          </form>

        </div>
      </div>
    </section>
  </main>

</body>
</html>
